<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso - Coliseum</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* RESET E VARIÁVEIS */
        :root {
            --primary: #ffcf00;
            --primary-dark: #e6b800;
            --secondary: #4361ee;
            --dark: #1a1a1a;
            --dark-light: #2a2a2a;
            --dark-lighter: #333333;
            --light: #ffffff;
            --gray: #888888;
            --success: #4CAF50;
            --danger: #f44336;
            --warning: #ff9800;
            --info: #2196F3;
            
            --border-radius: 12px;
            --border-radius-sm: 8px;
            --border-radius-lg: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.4);
            --transition: all 0.3s ease;
            --gradient-primary: linear-gradient(135deg, #ffcf00 0%, #ff6b00 100%);
            --gradient-dark: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark);
            color: var(--light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* BOTÃO VOLTAR */
        .btn-voltar {
            position: fixed;
            top: 25px;
            left: 25px;
            width: 60px;
            height: 60px;
            background: var(--dark-light);
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }

        .btn-voltar:hover {
            background: var(--primary);
            color: var(--dark);
            transform: translateX(-5px);
            box-shadow: 0 6px 25px rgba(255, 207, 0, 0.4);
        }

        /* CONTAINER PRINCIPAL */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 30px;
            animation: fadeIn 0.8s ease;
        }

        /* HEADER DO CURSO */
        .curso-header {
            background: var(--gradient-dark);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 207, 0, 0.1);
        }

        .curso-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
        }

        .curso-header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .curso-meta {
            display: flex;
            gap: 25px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gray);
            font-size: 0.95rem;
        }

        .meta-item i {
            color: var(--primary);
            font-size: 1.1rem;
        }

        /* MÓDULOS */
        .modulos-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modulo {
            background: var(--dark-light);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
        }

        .modulo:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(255, 207, 0, 0.2);
        }

        .modulo-header {
            padding: 25px;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            border-bottom: 2px solid transparent;
        }

        .modulo-header:hover {
            background: rgba(0, 0, 0, 0.4);
        }

        .modulo-header h3 {
            color: var(--light);
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modulo-header h3::before {
            content: '📚';
            font-size: 1.2rem;
        }

        .modulo-contador {
            background: var(--primary);
            color: var(--dark);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* AULAS */
        .aulas-container {
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, padding 0.3s ease;
        }

        .modulo.expanded .aulas-container {
            padding: 20px;
            max-height: 2000px;
        }

        .aula-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 15px;
            border-left: 4px solid transparent;
            position: relative;
            flex-wrap: wrap;
        }

        .aula-item:last-child {
            margin-bottom: 0;
        }

        .aula-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
            border-left-color: var(--primary);
        }

        .aula-item.completa {
            background: rgba(76, 175, 80, 0.1);
            border-left-color: var(--success);
        }

        .aula-icone {
            width: 40px;
            height: 40px;
            background: rgba(255, 207, 0, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .aula-item.completa .aula-icone {
            background: rgba(76, 175, 80, 0.2);
            color: var(--success);
        }

        .aula-info {
            flex: 1;
            min-width: 200px;
        }

        .aula-info h4 {
            color: var(--light);
            font-size: 1.1rem;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .aula-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: var(--gray);
        }

        .aula-status-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .aula-status {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        .aula-item.completa .aula-status {
            background: rgba(76, 175, 80, 0.2);
            color: var(--success);
        }

        /* BOTÃO DE CONCLUSÃO RÁPIDA */
        .btn-concluir-rapido {
            padding: 6px 14px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
        }

        .btn-concluir-rapido:hover {
            background: linear-gradient(135deg, #45a049, #3d8b40);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }

        .btn-concluir-rapido:active {
            transform: translateY(0);
        }

        .btn-concluir-rapido.concluido {
            background: #666;
            cursor: default;
            opacity: 0.7;
            pointer-events: none;
        }

        .btn-concluir-rapido.concluido:hover {
            transform: none;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
        }

        /* Aulas bloqueadas */
        .aula-item.bloqueada {
            background: rgba(255, 152, 0, 0.1) !important;
            border-left-color: var(--warning) !important;
            position: relative;
        }

        .aula-item.bloqueada .aula-icone {
            background: rgba(255, 152, 0, 0.2);
            color: var(--warning);
        }

        .aula-item.bloqueada .aula-status {
            background: rgba(255, 152, 0, 0.2);
            color: var(--warning);
        }

        .aula-item.bloqueada:hover {
            transform: none !important;
            border-left-color: var(--warning) !important;
            background: rgba(255, 152, 0, 0.15) !important;
        }

        .aula-item.bloqueada:hover .aula-info h4 {
            color: #888 !important;
        }

        .btn-solicitar {
            padding: 6px 14px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(67, 97, 238, 0.3);
        }

        .btn-solicitar:hover {
            background: #3a56d4;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.4);
        }

        .btn-solicitar:active {
            transform: translateY(0);
        }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 80px 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 207, 0, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            margin: 0 auto 25px;
            animation: spin 1s linear infinite;
        }

        .loading h3 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .loading p {
            color: var(--gray);
        }

        /* MODAL DE AULA */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--dark-light);
            margin: 30px auto;
            padding: 0;
            width: 95%;
            max-width: 1200px;
            max-height: 90vh;
            border-radius: var(--border-radius-lg);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            background: var(--gradient-dark);
            padding: 25px 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .modal-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 30px;
            right: 30px;
            height: 2px;
            background: var(--gradient-primary);
        }

        .modal-header h2 {
            color: var(--primary);
            font-size: 1.8rem;
            font-weight: 600;
            margin: 0;
            flex: 1;
            padding-right: 20px;
        }

        .modal-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--light);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .modal-close:hover {
            background: var(--danger);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px;
            overflow-y: auto;
            flex: 1;
        }

        /* CONTROLES DA AULA */
        .aula-controles {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .aula-info-controle {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .aula-tempo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .btn-concluir {
            background: var(--success);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-concluir:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .btn-concluir:active {
            transform: translateY(0);
        }

        .btn-concluir.concluida {
            background: var(--gray);
            cursor: not-allowed;
        }

        .btn-concluir.concluida:hover {
            transform: none;
            box-shadow: none;
        }

        /* VIDEO CONTAINER */
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 30px;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* CONTEÚDO DA AULA */
        .conteudo-aula {
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: var(--border-radius);
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .conteudo-aula h3 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255, 207, 0, 0.2);
        }

        .conteudo-aula p, .conteudo-aula li {
            margin-bottom: 15px;
            color: #e0e0e0;
        }

        .conteudo-aula ul, .conteudo-aula ol {
            padding-left: 20px;
            margin-bottom: 20px;
        }

        .conteudo-aula code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: var(--primary);
        }

        /* PROGRESSO */
        .progresso-bar {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--dark-light);
            padding: 15px 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 207, 0, 0.2);
            z-index: 100;
            animation: slideInRight 0.5s ease;
        }

        .progresso-bar h4 {
            color: var(--primary);
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .progresso-container {
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .progresso-fill {
            height: 100%;
            background: var(--gradient-primary);
            border-radius: 4px;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* NOTIFICAÇÃO DE CONCLUÍDO */
        .notificacao-concluido {
            position: fixed;
            top: 100px;
            right: 30px;
            background: var(--success);
            color: white;
            padding: 15px 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.5s ease, fadeOut 0.5s ease 2.5s forwards;
            max-width: 350px;
        }

        .notificacao-concluido i {
            font-size: 1.2rem;
        }

        .notificacao-desbloqueio {
            position: fixed;
            top: 100px;
            right: 30px;
            background: var(--info);
            color: white;
            padding: 15px 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.5s ease, fadeOut 0.5s ease 3s forwards;
            max-width: 350px;
        }

        .notificacao-solicitacao {
            position: fixed;
            top: 100px;
            right: 30px;
            background: linear-gradient(135deg, #4361ee 0%, #3a56d4 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 15px;
            max-width: 400px;
            animation: slideInRight 0.5s ease;
        }

        .notificacao-custom {
            position: fixed;
            top: 100px;
            right: 30px;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            display: flex;
            align-items: center;
            gap: 15px;
            max-width: 400px;
            animation: slideInRight 0.5s ease;
        }

        /* ANIMAÇÕES */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(50px);
            }
        }

        @keyframes fadeOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(50px);
            }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 207, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 207, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 207, 0, 0); }
        }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            .curso-header {
                padding: 25px 20px;
            }

            .curso-header h1 {
                font-size: 1.8rem;
            }

            .curso-meta {
                gap: 15px;
            }

            .modulo-header {
                padding: 20px;
            }

            .modulo-header h3 {
                font-size: 1.1rem;
            }

            .aula-item {
                padding: 15px;
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .aula-status-container {
                width: 100%;
                justify-content: flex-start;
            }

            .btn-concluir-rapido,
            .btn-solicitar {
                padding: 5px 10px;
                font-size: 0.75rem;
            }

            .btn-voltar {
                top: 15px;
                left: 15px;
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .modal-content {
                margin: 10px auto;
                width: 98%;
                max-height: 95vh;
            }

            .modal-header {
                padding: 20px;
            }

            .modal-header h2 {
                font-size: 1.4rem;
            }

            .modal-body {
                padding: 20px;
            }

            .aula-controles {
                padding: 15px 20px;
                flex-direction: column;
                align-items: stretch;
            }

            .btn-concluir {
                width: 100%;
                justify-content: center;
            }

            .progresso-bar {
                bottom: 20px;
                right: 20px;
                padding: 12px 20px;
            }

            .progresso-container {
                width: 150px;
            }

            .notificacao-concluido,
            .notificacao-desbloqueio,
            .notificacao-solicitacao,
            .notificacao-custom {
                top: 80px;
                right: 15px;
                left: 15px;
                max-width: none;
            }

            video {
                width: 100%;
                max-width: 100%;
                height: auto;
            }
            
            .video-container {
                margin: 0 -15px; 
                width: calc(100% + 30px);
            }
        }

        @media (max-width: 480px) {
            .curso-header h1 {
                font-size: 1.5rem;
            }

            .meta-item {
                font-size: 0.85rem;
            }

            .modal-header h2 {
                font-size: 1.2rem;
            }

            .progresso-bar {
                bottom: 10px;
                right: 10px;
                left: 10px;
                text-align: center;
            }

            .notificacao-concluido,
            .notificacao-desbloqueio,
            .notificacao-solicitacao,
            .notificacao-custom {
                top: 70px;
                padding: 12px 20px;
            }

            .btn-concluir-rapido,
            .btn-solicitar {
                padding: 5px 8px;
                font-size: 0.7rem;
            }
        }

        /* ESTADO VAZIO */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: var(--primary);
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--light);
        }

        /* SCROLLBAR PERSONALIZADA */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

.btn-solicitar.solicitacao-enviada {
    background: rgba(255, 193, 7, 0.15);
    border: 1px solid rgba(255, 193, 7, 0.45);
    color: #ffc107;
    cursor: default;
    opacity: 1;
}

.btn-solicitar.solicitacao-enviada:disabled {
    opacity: 1;
}

.aguardando-autorizacao {
    color: #ffc107;
}
    </style>
</head>
<body>
    <!-- Botão Voltar -->
    <button class="btn-voltar" onclick="voltarParaCursos()" title="Voltar para Cursos">
        <i class="fas fa-arrow-left"></i>
    </button>
    
    <!-- Progresso Fixo -->
    <div class="progresso-bar" id="progresso-bar">
        <h4>Progresso do Curso</h4>
        <div class="progresso-container">
            <div class="progresso-fill" id="progresso-fill"></div>
        </div>
    </div>

    <!-- Container Principal -->
    <div class="container">
        <!-- Header do Curso -->
        <div class="curso-header">
            <h1 id="curso-titulo">Carregando...</h1>
            <p id="curso-descricao"></p>
            <div class="curso-meta" id="curso-meta">
                <!-- Metadados serão preenchidos via JS -->
            </div>
        </div>
        
        <!-- Módulos -->
        <div id="modulos-container">
            <div class="loading">
                <div class="spinner"></div>
                <h3>Carregando conteúdo do curso...</h3>
                <p>Preparando sua experiência de aprendizado</p>
            </div>
        </div>
    </div>

    <!-- Modal de Aula -->
    <div class="modal" id="aula-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="aula-titulo"></h2>
                <button class="modal-close" onclick="fecharAula()" title="Fechar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="aula-conteudo">
                <!-- Conteúdo será carregado aqui -->
            </div>
            
            <!-- CONTROLES DA AULA (COM BOTÃO DE CONCLUIR) -->
            <div class="aula-controles" id="aula-controles" style="display: none;">
                <div class="aula-info-controle">
                    <div class="aula-tempo">
                        <i class="fas fa-clock"></i>
                        <span id="aula-duracao">--:--</span>
                    </div>
                    <div class="aula-tempo">
                        <i class="fas fa-check-circle"></i>
                        <span id="aula-estado">Não iniciada</span>
                    </div>
                </div>
                <button class="btn-concluir" id="btn-concluir-aula" onclick="marcarAulaConcluida()">
                    <i class="fas fa-check"></i>
                    <span>Marcar como Concluída</span>
                </button>
            </div>
        </div>
    </div>

<script>
    // VARIÁVEIS GLOBAIS
    let aulaAtualId = null;
    let aulaAtualConcluida = false;
    let gerenciador = null;

    // FUNÇÃO VOLTAR
    function voltarParaCursos() {
        console.log('Voltando para cursos...');
        const urlParams = new URLSearchParams(window.location.search);
        const from = urlParams.get('from');
        
        if (from === 'extras') {
            window.location.href = 'CursosExtras/indexEX.html';
        } else {
            window.history.back();
        }
    }

    // FUNÇÕES AUXILIARES PARA MODAL DE SOLICITAÇÃO
    function fecharModalSolicitacao() {
        const modal = document.getElementById('solicitacao-modal');
        if (modal) {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
            setTimeout(() => {
                if (modal.parentNode) modal.remove();
            }, 300);
        }
    }

    function mostrarNotificacaoSolicitacaoEnviada(proximaAula) {
        const notificacoesAntigas = document.querySelectorAll('.notificacao-solicitacao');
        notificacoesAntigas.forEach(notif => {
            if (notif.parentNode) notif.remove();
        });

        const notificacao = document.createElement('div');
        notificacao.className = 'notificacao-solicitacao';
        
        if (proximaAula) {
            notificacao.innerHTML = `
                <i class="fas fa-robot"></i>
                <div>
                    <strong>Solicitação Automática Enviada!</strong>
                    <div style="font-size: 0.85rem; opacity: 0.9; margin-top: 5px;">
                        Próxima aula: <strong>"${proximaAula.titulo}"</strong>
                    </div>
                </div>
            `;
        } else {
            notificacao.innerHTML = `
                <i class="fas fa-check-circle"></i>
                <div>
                    <strong>Solicitação Enviada com Sucesso!</strong>
                </div>
            `;
        }
        
        document.body.appendChild(notificacao);
        
        setTimeout(() => {
            if (notificacao.parentNode) {
                notificacao.style.animation = 'fadeOutRight 0.5s ease forwards';
                setTimeout(() => notificacao.remove(), 500);
            }
        }, 5000);
    }

    function showGlobalLoading(show) {
        if (show) {
            document.body.style.cursor = 'wait';
        } else {
            document.body.style.cursor = 'default';
        }
    }

    function mostrarNotificacao(mensagem, tipo = 'info', duracao = 4000) {
        const cores = {
            'success': '#4CAF50',
            'error': '#F44336',
            'warning': '#FF9800',
            'info': '#2196F3'
        };
        
        const icones = {
            'success': 'fas fa-check-circle',
            'error': 'fas fa-times-circle',
            'warning': 'fas fa-exclamation-triangle',
            'info': 'fas fa-info-circle'
        };
        
        const notificacoesAntigas = document.querySelectorAll('.notificacao-custom');
        notificacoesAntigas.forEach(notif => {
            if (notif.parentNode) notif.remove();
        });
        
        const notificacao = document.createElement('div');
        notificacao.className = 'notificacao-custom';
        notificacao.style.background = cores[tipo] || '#2196F3';
        
        notificacao.innerHTML = `
            <i class="${icones[tipo] || 'fas fa-info-circle'}"></i>
            <div>
                <strong>${mensagem}</strong>
            </div>
        `;
        
        document.body.appendChild(notificacao);
        
        setTimeout(() => {
            if (notificacao.parentNode) {
                notificacao.style.animation = 'fadeOutRight 0.5s ease forwards';
                setTimeout(() => notificacao.remove(), 500);
            }
        }, duracao);
    }

    // NOVA FUNÇÃO: Concluir aula rapidamente sem abrir o modal
    window.concluirAulaRapidamente = async function(aulaId) {
        console.log('⚡ Concluindo aula rapidamente:', aulaId);
        
        try {
            const gerenciador = window.gerenciador;
            if (!gerenciador) {
                mostrarNotificacao('Sistema não inicializado', 'error');
                return;
            }
            
            // Verificar se já está concluída
            if (gerenciador.aulasConcluidas.includes(aulaId)) {
                mostrarNotificacao('Esta aula já está concluída', 'info');
                return;
            }
            
            const aula = gerenciador.encontrarAula(aulaId);
            if (!aula) {
                mostrarNotificacao('Aula não encontrada', 'error');
                return;
            }
            
            // Marcar aula como concluída
            const concluida = gerenciador.marcarAulaConcluida(aulaId);
            
            if (concluida) {
                console.log(`✅ Aula "${aula.titulo}" concluída rapidamente`);
                
                // Atualizar botão imediatamente
                const btnRapido = document.querySelector(`.aula-item[data-aula-id="${aulaId}"] .btn-concluir-rapido`);
                if (btnRapido) {
                    btnRapido.innerHTML = '<i class="fas fa-check-double"></i> <span>Concluído</span>';
                    btnRapido.classList.add('concluido');
                    btnRapido.disabled = true;
                    btnRapido.onclick = null;
                }
                
                // Atualizar status da aula
                gerenciador.atualizarInterfaceAula(aulaId, true);
                
                // Enviar solicitação automática para próxima aula
                const solicitacaoEnviada = await enviarSolicitacaoAutomaticaParaProximaAula(aulaId);
                
                if (solicitacaoEnviada) {
                    console.log('✅ Solicitação automática enviada');
                }
                
                mostrarNotificacao(
                    `✅ Aula "${aula.titulo}" concluída com sucesso!`,
                    'success',
                    3000
                );
                
            } else {
                mostrarNotificacao('Falha ao salvar progresso', 'error');
            }
            
        } catch (error) {
            console.error('❌ Erro ao concluir aula rapidamente:', error);
            mostrarNotificacao(`Erro: ${error.message}`, 'error');
        }
    };

    // GERENCIADOR PRINCIPAL COM BLOQUEIO DE AULAS
    class GerenciadorCursos {
        constructor() {
            this.API_BASE = 'https://coliseum-api.onrender.com/api';
            this.usuarioId = this.obterUsuarioId();
            this.cursoId = this.obterCursoId();
            this.aulasConcluidas = this.carregarProgresso();
            this.totalAulas = 0;
            this.aulasCarregadas = 0;
            this.cursoData = null;
            this.aulasMap = new Map();
            this.aulasAutorizadas = new Set();
            this.bloqueioProgressivo = true;
        }

        obterUsuarioId() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const usuarioId = urlParams.get('usuarioId');
                
                if (usuarioId) {
                    localStorage.setItem('usuarioId', usuarioId);
                    return usuarioId;
                }
                
                return localStorage.getItem('usuarioId') || '1';
            } catch (e) {
                console.error('Erro:', e);
                return '1';
            }
        }

        obterCursoId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        carregarProgresso() {
            const progresso = localStorage.getItem(`progresso_${this.usuarioId}_${this.cursoId}`);
            return progresso ? JSON.parse(progresso) : [];
        }

        carregarAutorizacoes() {
            const autorizacoes = localStorage.getItem(`autorizacoes_${this.usuarioId}_${this.cursoId}`);
            return autorizacoes ? JSON.parse(autorizacoes) : [];
        }

        salvarProgresso() {
            localStorage.setItem(`progresso_${this.usuarioId}_${this.cursoId}`, 
                                JSON.stringify(this.aulasConcluidas));
            this.atualizarProgressoBar();
        }

        salvarAutorizacoes() {
            localStorage.setItem(`autorizacoes_${this.usuarioId}_${this.cursoId}`,
                                JSON.stringify(Array.from(this.aulasAutorizadas)));
        }

        marcarAulaConcluida(aulaId) {
            if (!this.aulasConcluidas.includes(aulaId)) {
                this.aulasConcluidas.push(aulaId);
                this.salvarProgresso();
                
                this.mostrarNotificacaoConcluido();
                this.atualizarInterfaceAula(aulaId);
                
                return true;
            }
            return false;
        }

        adicionarAutorizacao(aulaId) {
            if (!this.aulasAutorizadas.has(aulaId)) {
                this.aulasAutorizadas.add(aulaId);
                this.salvarAutorizacoes();
                console.log(`✅ Aula ${aulaId} autorizada pelo ADM`);
                return true;
            }
            return false;
        }

        verificarAulaAutorizada(aulaId) {
            console.log('Verificando autorização para aula', aulaId);
            
            if (this.aulasConcluidas.includes(aulaId)) {
                console.log('✅ Aula já concluída - acesso permitido para revisão');
                return true;
            }
            
            const aula = this.encontrarAula(aulaId);
            
            if (aula && aula.aulaIndex === 0) {
                console.log('✅ Primeira aula do módulo - acesso liberado automaticamente');
                return true;
            }
            
            if (this.aulasAutorizadas.has(aulaId)) {
                console.log('✅ Aula autorizada pelo ADM');
                return true;
            }
            
            console.log('❌ Aula NÃO autorizada');
            return false;
        }

        mostrarNotificacaoConcluido() {
            const notificacaoAnterior = document.querySelector('.notificacao-concluido');
            if (notificacaoAnterior) {
                notificacaoAnterior.remove();
            }

            const notificacao = document.createElement('div');
            notificacao.className = 'notificacao-concluido';
            notificacao.innerHTML = `
                <i class="fas fa-check-circle"></i>
                <div>
                    <strong>Aula Concluída!</strong>
                    <div style="font-size: 0.85rem; opacity: 0.9;">Progresso atualizado com sucesso</div>
                </div>
            `;

            document.body.appendChild(notificacao);

            setTimeout(() => {
                if (notificacao.parentNode) {
                    notificacao.remove();
                }
            }, 3000);
        }

        calcularProgresso() {
            if (this.totalAulas === 0) return 0;
            return Math.round((this.aulasConcluidas.length / this.totalAulas) * 100);
        }

        atualizarProgressoBar() {
            const progresso = this.calcularProgresso();
            const progressoFill = document.getElementById('progresso-fill');
            if (progressoFill) {
                progressoFill.style.width = `${progresso}%`;
            }
        }
        
        async carregarCurso() {
            try {
                if (!this.cursoId) {
                    this.mostrarErro('Curso não especificado');
                    return;
                }

                console.log('Buscando curso completo:', this.cursoId);
                
                const response = await fetch(`${this.API_BASE}/cursos/${this.cursoId}`);
                
                if (!response.ok) {
                    throw new Error(`Erro ${response.status} ao carregar curso`);
                }
                
                const data = await response.json();
                
                if (data.success && data.curso) {
                    this.cursoData = data.curso;
                    this.exibirCurso(data.curso);
                    
                    this.bloqueioProgressivo = data.curso.bloqueioProgressivo !== false;
                    
                    const autorizacoesSalvas = this.carregarAutorizacoes();
                    this.aulasAutorizadas = new Set(autorizacoesSalvas);
                    
                    await this.carregarAutorizacoesDaAPI();
                    
                    this.processarAulas(data.curso.modulos || []);
                } else {
                    throw new Error(data.error || 'Erro desconhecido');
                }
                
            } catch (error) {
                console.error('Erro ao carregar curso:', error);
                this.mostrarErro(error.message);
            }
        }

        async carregarAutorizacoesDaAPI() {
            try {
                console.log('Carregando autorizações da API...');
                
                const response = await fetch(
                    `${this.API_BASE}/autorizacoes/curso/${this.cursoId}/usuario/${this.usuarioId}`
                );
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('Autorizações da API:', data);
                    
                    if (data.success && data.autorizacoes) {
                        data.autorizacoes.forEach(auth => {
                            if (auth.aulaId) {
                                this.aulasAutorizadas.add(parseInt(auth.aulaId));
                            }
                        });
                        this.salvarAutorizacoes();
                        console.log('Autorizações carregadas da API:', Array.from(this.aulasAutorizadas));
                    }
                } else {
                    console.log('Nenhuma autorização encontrada na API');
                }
            } catch (error) {
                console.error('Erro ao carregar autorizações da API:', error);
            }
        }
        
        encontrarAulaAnterior(aulaId) {
            const aulaAtual = this.encontrarAula(aulaId);
            if (!aulaAtual) return null;

            const { moduloIndex, aulaIndex } = aulaAtual;
            
            if (aulaIndex > 0) {
                const modulo = this.cursoData.modulos[moduloIndex];
                return modulo.aulas[aulaIndex - 1];
            } else if (moduloIndex > 0) {
                const moduloAnterior = this.cursoData.modulos[moduloIndex - 1];
                if (moduloAnterior.aulas && moduloAnterior.aulas.length > 0) {
                    return moduloAnterior.aulas[moduloAnterior.aulas.length - 1];
                }
            }
            
            return null; 
        }

        processarAulas(modulos) {
            console.log('Processando módulos:', modulos);
            
            this.aulasMap.clear();
            this.totalAulas = 0;
            
            modulos.forEach((modulo, moduloIndex) => {
                if (modulo.aulas && Array.isArray(modulo.aulas)) {
                    modulo.aulas.forEach((aula, aulaIndex) => {
                        if (aula && aula.id) {
                            aula.moduloIndex = moduloIndex;
                            aula.aulaIndex = aulaIndex;
                            aula.primeiraDoModulo = (aulaIndex === 0);
                            this.aulasMap.set(aula.id, aula);
                            this.totalAulas++;
                        }
                    });
                }
            });
            
            console.log(`Total de aulas mapeadas: ${this.aulasMap.size}`);
            console.log('Aulas autorizadas:', Array.from(this.aulasAutorizadas));
            
            this.exibirModulosComAulas(modulos);
            this.atualizarProgressoBar();
        }

        exibirModulosComAulas(modulos) {
            const container = document.getElementById('modulos-container');
            
            if (!container) {
                console.error('Container de módulos não encontrado!');
                return;
            }
            
            if (!modulos || modulos.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-graduation-cap"></i>
                        <h3>Nenhum módulo encontrado</h3>
                        <p>Este curso ainda não possui conteúdo disponível.</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            for (let i = 0; i < modulos.length; i++) {
                const modulo = modulos[i];
                const aulasCount = modulo.aulas?.length || 0;
                
                html += `
                    <div class="modulo" id="modulo-${i}">
                        <div class="modulo-header" onclick="toggleModulo(${i})">
                            <h3>${this.escapeHtml(modulo.titulo || `Módulo ${i + 1}`)}</h3>
                            <span class="modulo-contador">${aulasCount} aula${aulasCount !== 1 ? 's' : ''}</span>
                        </div>
                        <div class="aulas-container" id="modulo-aulas-${i}">
                            ${this.gerarListaAulas(modulo.aulas || [])}
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }

        gerarListaAulas(aulas) {
            if (!aulas || aulas.length === 0) {
                return '<div style="padding:20px;color:#888;text-align:center;">Nenhuma aula disponível neste módulo</div>';
            }

            const solicitacaoEnviada =
                localStorage.getItem(
                    `solicitacao_${this.usuarioId}_${aula.id}`
                ) === 'enviada';
            
            let aulasHTML = '';
            
            for (let i = 0; i < aulas.length; i++) {
                const aula = aulas[i];
                if (!aula || !aula.id) continue;
                
                const concluida = this.aulasConcluidas.includes(aula.id);
                const primeiraAula = (i === 0);
                const autorizada = this.verificarAulaAutorizada(aula.id);
                const aulaIcon = aula.videoUrl ? 'fas fa-play-circle' : 'fas fa-book';
                const bloqueada = !autorizada && !concluida;

                const mostrarBotaoSolicitar = !concluida && !autorizada && !primeiraAula;
                const mostrarConcluirRapido = !concluida && (primeiraAula || autorizada);
                
                aulasHTML += `
                    <div class="aula-item ${concluida ? 'completa' : ''} ${bloqueada ? 'bloqueada' : ''}" 
                         onclick="${bloqueada ? '' : `iniciarAula(${aula.id})`}"
                         data-aula-id="${aula.id}"
                         data-aula-autorizada="${autorizada}"
                         data-primeira-aula="${primeiraAula}"
                         style="${bloqueada ? 'cursor: not-allowed;' : ''}">
                        <div class="aula-icone">
                            ${bloqueada ? 
                                '<i class="fas fa-lock" style="color: var(--warning);"></i>' : 
                                `<i class="${aulaIcon}"></i>`
                            }
                        </div>
                        <div class="aula-info">
                            <h4 style="${bloqueada ? 'color: #888;' : ''}">
                                ${this.escapeHtml(aula.titulo || `Aula ${aula.id}`)}
                                ${primeiraAula && !concluida ? 
                                    '<span style="color: var(--success); font-size: 0.8em; margin-left: 8px;">(Início)</span>' : 
                                    ''}
                                ${bloqueada ? 
                                    '<span style="color: var(--warning); font-size: 0.8em; margin-left: 8px;">(Bloqueada)</span>' : 
                                    ''}
                            </h4>
                            <div class="aula-meta">
                                <span><i class="fas fa-clock"></i> ${aula.duracao || '10:00'} min</span>
                                ${aula.nivel ? `<span><i class="fas fa-chart-bar"></i> ${aula.nivel}</span>` : ''}
                            </div>
                        </div>
                        
                        <div class="aula-status-container">
                            ${mostrarConcluirRapido ? `
                                <button class="btn-concluir-rapido" 
                                        onclick="event.stopPropagation(); concluirAulaRapidamente(${aula.id})"
                                        title="Concluir esta aula sem abrir">
                                    <i class="fas fa-check"></i>
                                    <span>Concluir</span>
                                </button>
                            ` : ''}
                            
                            ${mostrarBotaoSolicitar ? `
                                <button
                                    class="btn-solicitar ${solicitacaoEnviada ? 'solicitacao-enviada' : ''}"
                                    ${solicitacaoEnviada ? 'disabled' : ''}
                                    onclick="event.stopPropagation(); mostrarModalSolicitacaoAutorizacao(${aula.id})"
                                >
                                    <i class="fas ${solicitacaoEnviada ? 'fa-clock' : 'fa-paper-plane'}"></i>
                            
                                    <span>
                                        ${solicitacaoEnviada
                                            ? 'Solicitação enviada'
                                            : 'Solicitar'}
                                    </span>
                                </button>
                            ` : ''}
                            
                            <div class="aula-status">
                                ${concluida ? 
                                    '<i class="fas fa-check"></i> Concluída' : 
                                    bloqueada ? 
                                        '<i class="fas fa-lock"></i> Bloqueada' : 
                                        primeiraAula ? 
                                            '<i class="fas fa-play-circle"></i> Disponível' : 
                                            '<i class="fas fa-user-shield"></i> Autorizada'
                                }
                            </div>
                        </div>
                    </div>
                `;
            }
            
            return aulasHTML;
        }

        encontrarAula(aulaId) {
            if (this.aulasMap.has(aulaId)) {
                return this.aulasMap.get(aulaId);
            }
            
            if (this.cursoData && this.cursoData.modulos) {
                for (const modulo of this.cursoData.modulos) {
                    if (modulo.aulas) {
                        const aula = modulo.aulas.find(a => a.id == aulaId);
                        if (aula) return aula;
                    }
                }
            }
            
            return null;
        }

        exibirCurso(curso) {
            const tituloElement = document.getElementById('curso-titulo');
            const descricaoElement = document.getElementById('curso-descricao');
            const metaContainer = document.getElementById('curso-meta');
            
            if (tituloElement) {
                tituloElement.textContent = curso.titulo || 'Curso Sem Título';
            }
            
            if (descricaoElement) {
                descricaoElement.textContent = curso.descricao || '';
            }
            
            document.title = `${curso.titulo || 'Curso'} - Coliseum`;

            if (metaContainer) {

            const btnConcluir = document.getElementById('btn-concluir-aula');
            
            if (controles) {

                duracaoElement.textContent = aula.duracao;
            }
            
            if (estadoElement) {
                const concluida = this.aulasConcluidas.includes(aula.id);
                const primeiraAula = aula.aulaIndex === 0;
                const autorizada = this.verificarAulaAutorizada(aula.id);
                
                if (concluida) {
                    estadoElement.textContent = 'Concluída';
                    estadoElement.style.color = 'var(--success)';

                } else if (autorizada) {
                    estadoElement.textContent = 'Autorizada pelo ADM';
                    estadoElement.style.color = 'var(--info)';
                } else {
                    estadoElement.textContent = 'Aguardando autorização';
                    estadoElement.style.color = 'var(--warning)';

            if (btnConcluir) {
                const concluida = this.aulasConcluidas.includes(aula.id);

        extrairYouTubeId(url) {
            if (!url) return null;
            
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/v\/([a-zA-Z0-9_-]{11})/,
                /youtube\.com\/watch\?.*v=([a-zA-Z0-9_-]{11})/
            ];
            
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match && match[1]) {
                    return match[1];
                }
            }
            
            return null;
        }

        formatarTexto(texto) {

                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/```(.*?)```/gs, '<pre style="background:rgba(0,0,0,0.3);padding:15px;border-radius:8px;overflow:auto;"><code>$1</code></pre>')
                .replace(/`(.*?)`/g, '<code style="background:rgba(255,255,255,0.1);padding:2px 6px;border-radius:4px;">$1</code>');

    // FUNÇÕES GLOBAIS ADICIONAIS
    function encontrarProximaAula(aulaIdAtual) {
        const gerenciador = window.gerenciador;
        const aulaAtual = gerenciador.encontrarAula(aulaIdAtual);
        
        if (!aulaAtual) {
            console.error('❌ Aula atual não encontrada:', aulaIdAtual);
            return null;
        }
        
        const { moduloIndex, aulaIndex } = aulaAtual;
        const curso = gerenciador.cursoData;
        
        if (!curso || !curso.modulos) {
            console.error('❌ Dados do curso não disponíveis');
            return null;
        }
        
        console.log(`🔍 Procurando próxima aula - Módulo ${moduloIndex + 1}, Aula ${aulaIndex + 1}`);
        
        if (curso.modulos[moduloIndex]?.aulas && 
            aulaIndex + 1 < curso.modulos[moduloIndex].aulas.length) {
            const proximaAula = curso.modulos[moduloIndex].aulas[aulaIndex + 1];
            console.log(`✅ Próxima aula no mesmo módulo: ${proximaAula.titulo}`);
            return proximaAula;
        }
        else if (moduloIndex + 1 < curso.modulos.length) {
            const proximoModulo = curso.modulos[moduloIndex + 1];
            if (proximoModulo?.aulas && proximoModulo.aulas.length > 0) {
                const proximaAula = proximoModulo.aulas[0];
                console.log(`✅ Próxima aula no próximo módulo: ${proximaAula.titulo}`);
                return proximaAula;
            }
        }
        
        console.log('📭 Não há próxima aula disponível');
        return null;
    }

    async function enviarSolicitacaoParaAdm(aulaId, tipoSolicitacao = 'autorizacao_automatica', motivo = '') {
        console.log('🚀 INICIANDO envio de solicitação');
        
        try {
            const gerenciador = window.gerenciador;
            if (!gerenciador) {
                console.error('❌ Gerenciador não disponível');
                return false;
            }

            const aula = gerenciador.encontrarAula(aulaId);
            if (!aula) {
                console.error('❌ Aula não encontrada:', aulaId);
                return false;
            }

            const payload = {
                usuarioId: parseInt(gerenciador.usuarioId) || 1,
                cursoId: parseInt(gerenciador.cursoId) || 1,
                aulaId: parseInt(aulaId),
                tipo: tipoSolicitacao === 'autorizacao_automatica' ? 'automatica' : 'manual',
                motivo: motivo || `Aluno ${gerenciador.usuarioId} completou aula anterior.`,
                automatica: tipoSolicitacao === 'autorizacao_automatica'
            };

            console.log('📦 Enviando payload:', payload);

            const response = await fetch(`${gerenciador.API_BASE}/solicitacoes`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            console.log('📡 Status:', response.status, response.statusText);

            if (!response.ok) {
                let errorData = null;
            
                try {
                    errorData = await response.json();
                } catch (error) {
                    console.error('Não foi possível ler o erro do servidor:', error);
                }
            
                console.error('❌ Erro do servidor:', errorData);
            
                if (
                    errorData?.error === 'Solicitação já existe' ||
                    errorData?.details?.includes('solicitação pendente')
                ) {
                    mostrarNotificacao(
                        'Sua solicitação já foi enviada e está aguardando autorização.',
                        'info',
                        5000
                    );
            
                    return true;
                }
            
                mostrarNotificacao(
                    errorData?.error || 'Não foi possível enviar a solicitação.',
                    'error',
                    5000
                );
            
                return false;
            }

            const result = await response.json();
            console.log('✅ Sucesso:', result);
            return true;

        } catch (error) {
            console.error('💥 Erro fatal:', error);
            return false;
        }
    }

    async function enviarSolicitacaoAutomaticaParaProximaAula(aulaConcluidaId) {
        console.log('🚀 Enviando solicitação automática...');
        console.log(`📊 Aula concluída ID: ${aulaConcluidaId}`);
        
        try {
            const gerenciador = window.gerenciador;
            if (!gerenciador) {
                console.error('❌ Gerenciador não disponível');
                mostrarNotificacao('Erro: Sistema não inicializado', 'error');
                return false;
            }

            const payload = {
                usuarioId: parseInt(gerenciador.usuarioId) || 1,
                cursoId: parseInt(gerenciador.cursoId) || 1,
                aulaConcluidaId: parseInt(aulaConcluidaId)
            };

            console.log('📦 Payload sendo enviado:', JSON.stringify(payload));

            const response = await fetch(`${gerenciador.API_BASE}/solicitacoes/automatica`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            console.log('📡 Status:', response.status, response.statusText);

            if (!response.ok) {
                let errorText = 'Erro desconhecido';
                try {
                    errorText = await response.text();
                    console.error('❌ Resposta de erro:', errorText);
                    
                    try {
                        const errorData = JSON.parse(errorText);
                        console.error('📄 Erro detalhado (JSON):', errorData);
                        
                        if (errorData.error?.includes('já existe')) {
                            console.log('⚠️ Solicitação já existe - OK');
                            mostrarNotificacao('Solicitação já registrada anteriormente', 'info');
                            return true;
                        }
                    } catch (e) {
                        console.error('Resposta não é JSON:', errorText);
                    }
                } catch (textError) {
                    console.error('Não foi possível ler resposta:', textError);
                }
                
                mostrarNotificacao(`Erro ${response.status}: ${errorText.substring(0, 50)}`, 'error');
                return false;
            }

            const result = await response.json();
            console.log('✅ Resposta do servidor:', result);
            
            if (result.success) {
                if (result.proximaAula) {
                    mostrarNotificacaoSolicitacaoEnviada(result.proximaAula);
                } else if (result.message) {
                    mostrarNotificacao(result.message, 'success');
                } else {
                    mostrarNotificacao('Solicitação enviada com sucesso!', 'success');
                }
                return true;
            } else {
                mostrarNotificacao(result.error || 'Erro ao processar solicitação', 'error');
                return false;
            }

        } catch (error) {
            console.error('💥 Erro fatal:', error);
            mostrarNotificacao(`Erro de conexão: ${error.message}`, 'error');
            return false;
        }
    }

                                    <i class="fas fa-paper-plane"></i> Enviar Solicitação
                                </button>
                            </div>
                            
                            <div style="margin-top: 20px; color: #888; font-size: 0.85rem; text-align: center;">

        if (!document.getElementById('solicitacao-modal')) {
            document.body.insertAdjacentHTML('beforeend', modalHTML);
        }
        
        document.getElementById('solicitacao-modal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

        function marcarSolicitacaoComoEnviada(aulaId) {
            const aulaElement = document.querySelector(
                `.aula-item[data-aula-id="${aulaId}"]`
            );
        
            if (!aulaElement) return;
        
            const botaoSolicitar = aulaElement.querySelector('.btn-solicitar');
            const statusAula = aulaElement.querySelector('.aula-status');
        
            if (botaoSolicitar) {
                botaoSolicitar.disabled = true;
                botaoSolicitar.classList.add('solicitacao-enviada');
        
                botaoSolicitar.innerHTML = `
                    <i class="fas fa-clock"></i>
                    <span>Solicitação enviada</span>
                `;
            }
        
            if (statusAula) {
                statusAula.innerHTML = `
                    <i class="fas fa-hourglass-half"></i>
                    Aguardando autorização
                `;
        
                statusAula.classList.add('aguardando-autorizacao');
            }
        
            localStorage.setItem(
                `solicitacao_${window.gerenciador.usuarioId}_${aulaId}`,
                'enviada'
            );
        }
    
  async function enviarSolicitacaoAutorizacaoManual(aulaId) {
    const motivo =
        document.getElementById('motivo-solicitacao')?.value.trim() ||
        'Solicitação manual do aluno para acessar a aula.';

    try {
        showGlobalLoading(true);

        const enviada = await enviarSolicitacaoParaAdm(
            aulaId,
            'autorizacao_manual',
            motivo
        );

        if (enviada) {
            fecharModalSolicitacao();

            marcarSolicitacaoComoEnviada(aulaId);

            mostrarNotificacao(
                'Solicitação enviada! Aguarde a autorização do administrador.',
                'success',
                5000
            );
        } else {
            throw new Error('Não foi possível enviar a solicitação');
        }
    } catch (error) {
        console.error('Erro ao enviar solicitação:', error);

        mostrarNotificacao(
            'Não foi possível enviar a solicitação. Tente novamente.',
            'error',
            5000
        );
    } finally {
        showGlobalLoading(false);
    }
}

    // FUNÇÕES GLOBAIS EXPOSTAS
    window.toggleModulo = function(index) {
        const modulo = document.getElementById(`modulo-${index}`);
        const aulasContainer = document.getElementById(`modulo-aulas-${index}`);
        
        if (!modulo || !aulasContainer) return;
        
        if (modulo.classList.contains('expanded')) {
            modulo.classList.remove('expanded');
            aulasContainer.style.maxHeight = '0';
        } else {
            modulo.classList.add('expanded');
            aulasContainer.style.maxHeight = aulasContainer.scrollHeight + 'px';
        }
    };

    window.iniciarAula = async function(aulaId) {
        try {
            console.log('=== INICIANDO AULA ===');
            console.log('Aula ID:', aulaId);
            
            const gerenciador = window.gerenciador;
            if (!gerenciador) {
                throw new Error('Sistema não inicializado');
            }
            
            const autorizada = gerenciador.verificarAulaAutorizada(aulaId);
            console.log('Aula autorizada?', autorizada);
            
            if (!autorizada) {
                const aula = gerenciador.encontrarAula(aulaId);
                if (aula && aula.aulaIndex !== 0) {
                    mostrarModalSolicitacaoAutorizacao(aulaId);
                    return;
                }
            }
            
            const conteudoElement = document.getElementById('aula-conteudo');
            if (conteudoElement) {
                conteudoElement.innerHTML = `
                    <div style="text-align:center; padding: 80px 20px;">
                        <div class="spinner"></div>
                        <h3 style="margin-top:25px; color:var(--primary);">Carregando conteúdo da aula...</h3>
                        <p style="color:var(--gray);">Preparando a melhor experiência de aprendizado</p>
                    </div>
                `;
            }
            
            const modal = document.getElementById('aula-modal');
            if (modal) {
                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';
            }
            
            const conteudo = await gerenciador.carregarConteudoAula(aulaId);
            
            if (conteudoElement) {
                conteudoElement.innerHTML = conteudo;
            }
            
        } catch (error) {
            console.error('Erro ao iniciar aula:', error);
            const conteudoElement = document.getElementById('aula-conteudo');
            if (conteudoElement) {
                conteudoElement.innerHTML = `
                    <div style="text-align:center; padding: 50px 20px; color:var(--danger);">
                        <i class="fas fa-exclamation-triangle" style="font-size:3rem; margin-bottom:20px;"></i>
                        <h3>Erro ao iniciar a aula</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    };

    window.marcarAulaConcluida = async function() {
        console.log('🎯 Iniciando marcação de aula como concluída...');
        
        try {
            if (!aulaAtualId) {
                console.error('❌ Nenhuma aula selecionada');
                mostrarNotificacao('Nenhuma aula selecionada', 'error');
                return;
            }
            
            const gerenciador = window.gerenciador;
            if (!gerenciador) {
                console.error('❌ Gerenciador não inicializado');
                mostrarNotificacao('Sistema não inicializado', 'error');
                return;
            }
            
            console.log(`🔍 Verificando aula ${aulaAtualId}...`);
            
            if (gerenciador.aulasConcluidas.includes(aulaAtualId)) {
                console.log('ℹ️ Aula já está concluída');
                mostrarNotificacao('Esta aula já está concluída', 'info');
                return;
            }
            
            const aula = gerenciador.encontrarAula(aulaAtualId);
            if (!aula) {
                console.error(`❌ Aula ${aulaAtualId} não encontrada`);
                mostrarNotificacao('Aula não encontrada', 'error');
                return;
            }
            
            console.log(`📝 Aula encontrada: ${aula.titulo}`);
            
            const isPrimeiraAula = aula.aulaIndex === 0;
            
            if (!isPrimeiraAula) {
                const autorizada = gerenciador.verificarAulaAutorizada(aulaAtualId);
                
                if (!autorizada) {
                    console.log('❌ Aula não autorizada! Mostrando modal...');
                    mostrarModalSolicitacaoAutorizacao(aulaAtualId);
                    return;
                }
            }
            
            console.log('✅ Marcando aula como concluída...');
            const concluida = gerenciador.marcarAulaConcluida(aulaAtualId);
            
            if (concluida) {
                aulaAtualConcluida = true;
                console.log(`✅ Aula "${aula.titulo}" marcada como concluída`);
                
                const proximaAula = encontrarProximaAula(aulaAtualId);
                
                if (proximaAula) {
                    console.log(`📤 Próxima aula encontrada: ${proximaAula.titulo}`);
                    console.log(`📤 Enviando solicitação automática...`);
                    
                    const solicitacaoEnviada = await enviarSolicitacaoAutomaticaParaProximaAula(aulaAtualId);
                    
                    if (solicitacaoEnviada) {
                        console.log('✅ Solicitação enviada com sucesso');
                    } else {
                        console.log('⚠️ Problema ao enviar solicitação');
                    }
                } else {
                    console.log('🎉 Última aula do curso concluída!');
                    mostrarNotificacao(
                        '🎊 Parabéns! Você concluiu todas as aulas deste curso!',
                        'success',
                        5000
                    );
                }
                
                const btnConcluir = document.getElementById('btn-concluir-aula');
                if (btnConcluir) {
                    btnConcluir.innerHTML = '<i class="fas fa-check-double"></i> <span>Aula Concluída</span>';
                    btnConcluir.classList.add('concluida');
                    btnConcluir.disabled = true;
                }
                
                const estadoElement = document.getElementById('aula-estado');
                if (estadoElement) {
                    estadoElement.textContent = 'Concluída';
                    estadoElement.style.color = '#4CAF50';
                }
                
            } else {
                console.error('❌ Falha ao marcar aula como concluída');
                mostrarNotificacao('Falha ao salvar progresso', 'error');
            }
            
        } catch (error) {
            console.error('❌ Erro ao marcar aula como concluída:', error);
            mostrarNotificacao(`Erro: ${error.message}`, 'error');
        }
    };
    
    window.fecharAula = function() {
        const modal = document.getElementById('aula-modal');
        if (modal) {
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    };

    // FECHAR MODAL COM ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            fecharAula();
            fecharModalSolicitacao();
        }
    });

    // FECHAR MODAL AO CLICAR FORA
    document.addEventListener('click', function(e) {
        const modalAula = document.getElementById('aula-modal');
        const modalSolicitacao = document.getElementById('solicitacao-modal');
        
        if (modalAula && e.target === modalAula) {
            fecharAula();
        }
        
        if (modalSolicitacao && e.target === modalSolicitacao) {
            fecharModalSolicitacao();
        }
    });

    // INICIALIZAR
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM carregado - Iniciando Gerenciador de Cursos');
        window.gerenciador = new GerenciadorCursos();
        window.gerenciador.carregarCurso();
    });
</script>
